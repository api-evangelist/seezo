aid: seezo
name: Seezo
description: >-
  Seezo is an automated, AI-powered security design review platform. It analyzes
  design documents and product requirement docs (PRDs) to generate explainable,
  consistent, and contextual security requirements — threat models, data-flow
  diagrams, and component maps — before developers begin coding, then routes
  those requirements into the tools engineering teams already use (Jira, GitHub,
  Slack, Confluence, Linear, ServiceNow, and more). Seezo is SOC 2 and ISO 27001
  certified. It does not currently publish a public developer API, SDKs, or an
  OpenAPI definition; its OAuth surface authenticates users of the Seezo web app.
